name: Build AI Stoica Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ai-stoica-main-files

permissions:
  contents: write

concurrency:
  group: ai-stoica-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read application version
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          "AI_STOICA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Windows app dependencies
        working-directory: apps/desktop
        run: npm install --legacy-peer-deps

      - name: Verify Electron startup files
        working-directory: apps/desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check local-gateway.cjs

      - name: Run all desktop tests
        working-directory: apps/desktop
        shell: bash
        run: for t in scripts/test-*.cjs; do echo "::group::$t"; node "$t"; echo "::endgroup::"; done

      - name: Build AI Stoica Windows
        working-directory: apps/desktop
        run: npm run build

      - name: Verify auto-update metadata
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = $env:AI_STOICA_VERSION
          $releaseDir = "apps/desktop/release"
          $installer = Join-Path $releaseDir "AI_Stoica_Setup_${version}_x64.exe"
          $latest = Join-Path $releaseDir "latest.yml"
          $blockmap = "$installer.blockmap"
          foreach ($file in @($installer,$latest,$blockmap)) {
            if (!(Test-Path $file)) { Write-Error "Lipsește fișierul necesar pentru auto-update: $file"; exit 1 }
          }

      - name: Publish Windows installer and auto-update metadata
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:AI_STOICA_VERSION
          $tag = "v$version"
          $dir = "apps/desktop/release"
          $installer = "$dir/AI_Stoica_Setup_${version}_x64.exe"
          # latest.yml + .blockmap are what the in-app auto-update reads; without them updates never arrive.
          $files = @($installer, "$dir/latest.yml") + @(Get-ChildItem "$dir/*.blockmap" | ForEach-Object { $_.FullName })
          foreach ($f in $files) { if (!(Test-Path $f)) { Write-Error "Lipseste fisierul de release: $f"; exit 1 } }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "AI Stoica $version" --notes "AI Stoica $version pentru Windows. Instaleaza AI_Stoica_Setup_${version}_x64.exe; versiunile instalate se actualizeaza automat."
          }
