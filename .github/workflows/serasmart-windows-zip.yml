name: Serasmart AI - ZIP complet Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - ".github/workflows/serasmart-windows-zip.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - ".github/workflows/serasmart-windows-zip.yml"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('zip-pr-{0}', github.ref) || format('serasmart-release-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: windows-latest

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Instaleaza Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Citeste versiunea aplicatiei
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          "SERASMART_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Instaleaza dependentele
        working-directory: apps/desktop
        run: npm install --legacy-peer-deps

      - name: Verifica Electron
        working-directory: apps/desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check local-gateway.cjs

      - name: Run all desktop tests
        working-directory: apps/desktop
        shell: bash
        run: for t in scripts/test-*.cjs; do echo "::group::$t"; node "$t"; echo "::endgroup::"; done

      - name: Construieste Serasmart AI Windows
        working-directory: apps/desktop
        run: npm run build

      - name: Creeaza pachetul ZIP complet
        shell: pwsh
        run: |
          $version = $env:SERASMART_VERSION
          $releaseDir = "apps/desktop/release"
          $installer = Join-Path $releaseDir "Serasmart_Setup_${version}_x64.exe"
          $latest = Join-Path $releaseDir "latest.yml"
          $blockmap = "$installer.blockmap"
          $portable = Join-Path $releaseDir "win-unpacked"
          $packageDir = "Serasmart_Windows_${version}_COMPLET"
          $zip = "Serasmart_Windows_${version}_COMPLET.zip"

          if (!(Test-Path $installer)) {
            Write-Error "Installerul nu a fost gasit: $installer"
            exit 1
          }
          if (!(Test-Path $portable)) {
            Write-Error "Folderul win-unpacked nu a fost gasit: $portable"
            exit 1
          }
          foreach ($file in @($latest,$blockmap)) {
            if (!(Test-Path $file)) {
              Write-Error "Lipsește fișierul necesar pentru auto-update: $file"
              exit 1
            }
          }

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $packageDir "Portable") | Out-Null
          Copy-Item $installer -Destination $packageDir
          Copy-Item $latest -Destination $packageDir
          Copy-Item $blockmap -Destination $packageDir
          Copy-Item "$portable\*" -Destination (Join-Path $packageDir "Portable") -Recurse -Force

          "SERASMART AI $version - WINDOWS" | Out-File -FilePath (Join-Path $packageDir "README_INSTALLARE.txt") -Encoding utf8
          "" | Out-File -FilePath (Join-Path $packageDir "README_INSTALLARE.txt") -Append -Encoding utf8
          "INSTALARE: ruleaza Serasmart_Setup_${version}_x64.exe." | Out-File -FilePath (Join-Path $packageDir "README_INSTALLARE.txt") -Append -Encoding utf8
          "PORTABIL: intra in folderul Portable si ruleaza Serasmart AI.exe." | Out-File -FilePath (Join-Path $packageDir "README_INSTALLARE.txt") -Append -Encoding utf8

          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash
          $portableExe = Join-Path $packageDir "Portable\Serasmart AI.exe"
          $portableHash = if (Test-Path $portableExe) { (Get-FileHash $portableExe -Algorithm SHA256).Hash } else { "N/A" }
          "SHA256" | Out-File -FilePath (Join-Path $packageDir "SHA256SUMS.txt") -Encoding utf8
          "Serasmart_Setup_${version}_x64.exe  $installerHash" | Out-File -FilePath (Join-Path $packageDir "SHA256SUMS.txt") -Append -Encoding utf8
          "Portable\Serasmart AI.exe        $portableHash" | Out-File -FilePath (Join-Path $packageDir "SHA256SUMS.txt") -Append -Encoding utf8

          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name,Length,LastWriteTime

      - name: Publica ZIP-ul in GitHub Releases
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:SERASMART_VERSION
          $tag = "v$version"
          $zip = "Serasmart_Windows_${version}_COMPLET.zip"
          # Only the ZIP goes to the Release. latest.yml and the .blockmap are published by "Build Serasmart AI Windows"
          # together with the .exe from the same build; this job builds again, so its hashes would not match that .exe
          # and electron-updater would reject the update.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "Serasmart AI $version" --notes "Serasmart AI principal pentru Windows."
          }

      - name: Incarca ZIP ca Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Serasmart-AI-Windows-${{ env.SERASMART_VERSION }}-COMPLET
          path: Serasmart_Windows_${{ env.SERASMART_VERSION }}_COMPLET.zip
          if-no-files-found: error
          retention-days: 7

      - name: Link descarcare
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = $env:SERASMART_VERSION
          $url = "https://github.com/andrei18stoica-eng/Serasmart-AI/releases/download/v$version/Serasmart_Windows_${version}_COMPLET.zip"
          "# Serasmart AI Windows ZIP complet este gata" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "## [DESCARCA ZIP COMPLET]($url)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Contine installer EXE, varianta portabila, README si SHA256SUMS." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

# retry-after-storage-cleanup
