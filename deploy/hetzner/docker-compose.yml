services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      # Separate PG* variables (read by node-postgres) work with any character in the password; a URL would need it percent-encoded.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_INITIAL_PASSWORD: ${OWNER_INITIAL_PASSWORD:-}
      AUTH_ATTEMPTS_PER_15_MIN: ${AUTH_ATTEMPTS_PER_15_MIN:-20}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      AUTH_ME_PER_MINUTE: ${AUTH_ME_PER_MINUTE:-600}
      REGISTRATIONS_PER_HOUR: ${REGISTRATIONS_PER_HOUR:-10}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "127.0.0.1:8787:8787"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AI_STOICA_DOMAIN: ${AI_STOICA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
