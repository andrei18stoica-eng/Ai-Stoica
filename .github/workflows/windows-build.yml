name: Build AI Stoica Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ai-stoica-main-files

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Windows app dependencies
        working-directory: apps/desktop
        run: npm install --legacy-peer-deps

      - name: Verify Electron startup files
        working-directory: apps/desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check local-gateway.cjs

      - name: Test real PDF DOCX PPTX generation and download
        working-directory: apps/desktop
        run: node scripts/test-document-export.cjs

      - name: Build AI Stoica Windows
        working-directory: apps/desktop
        run: npm run build

      - name: Publish Windows installer to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.6.1"
          $installer = "apps/desktop/release/AI_Stoica_Setup_0.6.1_x64.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "AI Stoica 0.6.1" --notes "Versiunea principală AI Stoica 0.6.1 pentru Windows: Cloudflare backend, fișiere, PDF/DOCX, Copy, memorie și GitHub Solve."
          }
