name: Generate desktop package-lock
on:
  push:
    branches:
      - "chore/desktop-package-lock-0710"
    paths:
      - ".github/workflows/generate-desktop-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/desktop-package-lock-0710

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate package-lock.json with npm install
        working-directory: apps/desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify package.json unchanged
        run: |
          git diff --exit-code -- apps/desktop/package.json

      - name: Commit only package-lock and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/generate-desktop-lock.yml
          git add apps/desktop/package-lock.json .github/workflows/generate-desktop-lock.yml
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/generate-desktop-lock.yml apps/desktop/package-lock.json "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add desktop package-lock.json"
          git push origin HEAD:chore/desktop-package-lock-0710
