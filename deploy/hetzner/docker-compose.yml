services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      # Separate PG* variables (read by node-postgres) work with any character in the password; a URL would need it percent-encoded.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_INITIAL_PASSWORD: ${OWNER_INITIAL_PASSWORD:-}
      AUTH_ATTEMPTS_PER_15_MIN: ${AUTH_ATTEMPTS_PER_15_MIN:-20}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      AUTH_ME_PER_MINUTE: ${AUTH_ME_PER_MINUTE:-600}
      REGISTRATIONS_PER_HOUR: ${REGISTRATIONS_PER_HOUR:-10}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "127.0.0.1:8787:8787"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  # Web version and installable phone app (PWA): the AI Stoica service with the web interface (apps/cloud image).
  # Accounts, approval and permissions come from the api service above (same accounts as the Windows app in cloud mode).
  # Turned on by the "web" profile, e.g. COMPOSE_PROFILES=edge,web in .env; served by Caddy at AI_STOICA_WEB_DOMAIN.
  web:
    profiles: ["web"]
    build:
      context: ../..
      dockerfile: apps/cloud/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      AI_STOICA_CLOUD_API_URL: http://api:8787
      AI_STOICA_OWNER_EMAIL: ${OWNER_EMAIL}
      AI_STOICA_TRUST_PROXY: ${TRUST_PROXY_HOPS:-1}
      AI_STOICA_DEFAULT_MODEL: ${AI_STOICA_DEFAULT_MODEL:-}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - web-data:/data
    ports:
      - "127.0.0.1:8788:8787"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AI_STOICA_DOMAIN: ${AI_STOICA_DOMAIN}
      AI_STOICA_WEB_DOMAIN: ${AI_STOICA_WEB_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m

volumes:
  postgres-data:
  web-data:
  caddy-data:
  caddy-config:
