name: Check AI Stoica Files Mobile

on:
  workflow_dispatch:
  push:
    branches: [ai-stoica-files-github]
    paths:
      - "apps/mobile-files/**"
      - ".github/workflows/mobile-files-check.yml"
  pull_request:
    paths:
      - "apps/mobile-files/**"
      - ".github/workflows/mobile-files-check.yml"

jobs:
  mobile-files:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-files

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mobile-files/package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo doctor
        run: npx expo-doctor

      - name: Export iOS bundle
        env:
          EXPO_PUBLIC_GATEWAY_URL: https://gateway.example.com
          EXPO_PUBLIC_DEFAULT_MODEL: AI Stoica Performance Max
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Export Android bundle
        env:
          EXPO_PUBLIC_GATEWAY_URL: https://gateway.example.com
          EXPO_PUBLIC_DEFAULT_MODEL: AI Stoica Performance Max
        run: npx expo export --platform android --output-dir dist-android
