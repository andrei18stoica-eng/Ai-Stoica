name: AI Stoica - Descarcare Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ai-stoica-windows-download.yml"

permissions:
  contents: write

jobs:
  build-windows-download:
    runs-on: windows-latest

    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Instaleaza Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instaleaza dependentele AI Stoica
        working-directory: apps/desktop
        run: npm install --legacy-peer-deps

      - name: Verifica fisierele Electron
        working-directory: apps/desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check local-gateway.cjs

      - name: Testeaza permisiunile AI
        working-directory: apps/desktop
        run: node scripts/test-ai-access-enforcement.cjs

      - name: Testeaza regresiile de infrastructura
        working-directory: apps/desktop
        run: node scripts/test-infrastructure-regressions.cjs

      - name: Testeaza generarea imagini si video
        working-directory: apps/desktop
        run: node scripts/test-media-generation.cjs

      - name: Construieste AI Stoica pentru Windows
        working-directory: apps/desktop
        run: npm run build

      - name: Publica installerul Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.6.13"
          $installer = "apps/desktop/release/AI_Stoica_Setup_0.6.13_x64.exe"
          if (!(Test-Path $installer)) {
            Write-Error "Installerul AI Stoica nu a fost gasit: $installer"
            exit 1
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "AI Stoica 0.6.13" --notes "AI Stoica principal pentru Windows."
          }

      - name: Incarca installerul ca Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: AI-Stoica-Windows-0.6.13
          path: apps/desktop/release/AI_Stoica_Setup_0.6.13_x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: DESCARCA AI STOICA WINDOWS
        shell: pwsh
        run: |
          $url = "https://github.com/andrei18stoica-eng/Ai-Stoica/releases/download/v0.6.13/AI_Stoica_Setup_0.6.13_x64.exe"
          @"
          # ✅ AI Stoica pentru Windows este gata

          ## [⬇️ DESCARCĂ AI STOICA WINDOWS (.EXE)]($url)

          Fișier: `AI_Stoica_Setup_0.6.13_x64.exe`

          Dacă browserul întreabă dacă vrei să păstrezi fișierul, alege **Keep / Păstrează**.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
