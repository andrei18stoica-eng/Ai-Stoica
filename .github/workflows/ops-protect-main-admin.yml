name: Apply main protection with admin token
on:
  push:
    branches:
      - "ops/protect-main-admin"
    paths:
      - ".github/workflows/ops-protect-main-admin.yml"
      - ".github/ops/protect-main-trigger.txt"

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Require admin token
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "${ADMIN_TOKEN}" ]; then
            echo "::error::Repository secret ADMIN_TOKEN is missing. It must be a fine-grained PAT with Administration: Read and write for Ai-Stoica."
            exit 78
          fi

      - name: Create main protection ruleset
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/ruleset.json <<'JSON'
          {
            "name": "Protect main",
            "target": "branch",
            "enforcement": "active",
            "bypass_actors": [
              {
                "actor_id": 333657981,
                "actor_type": "User",
                "bypass_mode": "always"
              }
            ],
            "conditions": {
              "ref_name": {
                "include": ["refs/heads/main"],
                "exclude": []
              }
            },
            "rules": [
              {"type": "deletion"},
              {"type": "non_fast_forward"},
              {
                "type": "pull_request",
                "parameters": {
                  "allowed_merge_methods": ["merge", "squash", "rebase"],
                  "dismiss_stale_reviews_on_push": false,
                  "require_code_owner_review": false,
                  "require_last_push_approval": false,
                  "required_approving_review_count": 0,
                  "required_review_thread_resolution": false
                }
              },
              {
                "type": "required_status_checks",
                "parameters": {
                  "do_not_enforce_on_create": false,
                  "required_status_checks": [
                    {"context": "desktop-check", "integration_id": 15368},
                    {"context": "server-check", "integration_id": 15368}
                  ],
                  "strict_required_status_checks_policy": true
                }
              }
            ]
          }
          JSON

          existing_id="$(
            curl -fsSL               -H "Authorization: Bearer ${ADMIN_TOKEN}"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2026-03-10"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets" |
            jq -r '.[] | select(.name=="Protect main") | .id' | head -1
          )"

          if [ -n "${existing_id}" ]; then
            method="PUT"
            endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets/${existing_id}"
          else
            method="POST"
            endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets"
          fi

          curl --fail-with-body -L             -X "${method}"             -H "Authorization: Bearer ${ADMIN_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "${endpoint}"             --data-binary @/tmp/ruleset.json | tee /tmp/ruleset-result.json

          echo "RULESET_ID=$(jq -r '.id' /tmp/ruleset-result.json)" >> "$GITHUB_ENV"

      - name: Verify ruleset
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body -fsSL             -H "Authorization: Bearer ${ADMIN_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets/${RULESET_ID}" |
          jq '{
            id,
            name,
            enforcement,
            target,
            bypass_actors,
            conditions,
            rules
          }'

      - name: Delete temporary ops branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L             -X DELETE             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/ops%2Fprotect-main-admin"
