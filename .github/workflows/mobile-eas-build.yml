name: Build AI Stoica Mobile with EAS

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - ios
          - android
          - all
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_GATEWAY_URL: ${{ secrets.EXPO_PUBLIC_GATEWAY_URL }}
      EXPO_PUBLIC_DEFAULT_MODEL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing GitHub secret EXPO_TOKEN"; exit 1; }
          test -n "$EXPO_PUBLIC_GATEWAY_URL" || { echo "Missing GitHub secret EXPO_PUBLIC_GATEWAY_URL"; exit 1; }

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Expo account
        run: eas whoami

      - name: Inject public app environment into EAS profile
        shell: bash
        env:
          EAS_PROFILE: ${{ inputs.profile }}
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const file="eas.json";
          const data=JSON.parse(fs.readFileSync(file,"utf8"));
          const profile=process.env.EAS_PROFILE;
          data.build=data.build||{};
          data.build[profile]=data.build[profile]||{};
          data.build[profile].env={
            ...(data.build[profile].env||{}),
            EXPO_PUBLIC_GATEWAY_URL:process.env.EXPO_PUBLIC_GATEWAY_URL,
            EXPO_PUBLIC_DEFAULT_MODEL:process.env.EXPO_PUBLIC_DEFAULT_MODEL||""
          };
          if(!data.build[profile].env.EXPO_PUBLIC_GATEWAY_URL)throw new Error("EXPO_PUBLIC_GATEWAY_URL lipsește");
          fs.writeFileSync(file,JSON.stringify(data,null,2)+"\n");
          console.log("EAS profile",profile,"configured with gateway",data.build[profile].env.EXPO_PUBLIC_GATEWAY_URL);
          NODE

      - name: Start cloud build
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
