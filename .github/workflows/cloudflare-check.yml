name: Check AI Stoica Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [cloudflare-free, cloudflare-max-model, cerebras-primary]
    paths:
      - "apps/cloudflare/**"
      - ".github/workflows/cloudflare-check.yml"
  pull_request:
    paths:
      - "apps/cloudflare/**"
      - ".github/workflows/cloudflare-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run check
