name: Build AI Stoica Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ai-stoica-main-files

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read application version
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          "AI_STOICA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Windows app dependencies
        working-directory: apps/desktop
        run: npm install --legacy-peer-deps

      - name: Verify Electron startup files
        working-directory: apps/desktop
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check local-gateway.cjs

      - name: Test real document generation and download
        working-directory: apps/desktop
        run: node scripts/test-document-export.cjs

      - name: Test paid model access enforcement
        working-directory: apps/desktop
        run: node scripts/test-ai-access-enforcement.cjs

      - name: Test infrastructure regressions
        working-directory: apps/desktop
        run: node scripts/test-infrastructure-regressions.cjs

      - name: Test real image and video generation
        working-directory: apps/desktop
        run: node scripts/test-media-generation.cjs

      - name: Testeaza uneltele Owner
        working-directory: apps/desktop
        run: node scripts/test-owner-tools.cjs

      - name: Build AI Stoica Windows
        working-directory: apps/desktop
        run: npm run build

      - name: Publish Windows installer to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:AI_STOICA_VERSION
          $tag = "v$version"
          $installer = "apps/desktop/release/AI_Stoica_Setup_${version}_x64.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --title "AI Stoica $version" --notes "Versiunea principală AI Stoica $version pentru Windows: Owner Control Center, Hetzner Cloud, pluginuri, fișiere și documente."
          }
