services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      # Separate PG* variables (read by node-postgres) work with any character in the password; a URL would need it percent-encoded.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_INITIAL_PASSWORD: ${OWNER_INITIAL_PASSWORD:-}
      AUTH_ATTEMPTS_PER_15_MIN: ${AUTH_ATTEMPTS_PER_15_MIN:-20}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      AUTH_ME_PER_MINUTE: ${AUTH_ME_PER_MINUTE:-600}
      REGISTRATIONS_PER_HOUR: ${REGISTRATIONS_PER_HOUR:-10}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "127.0.0.1:8787:8787"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  # OmniRoute for the web version: the same model router (and combinations such as "Ai principal") as on Windows.
  # Private: its dashboard is reached only through an SSH tunnel to 127.0.0.1:20128 (see README).
  omniroute-redis:
    image: redis:7-alpine
    profiles: ["web"]
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - omniroute-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  omniroute:
    # Set OMNIROUTE_VERSION in .env to a fixed release so an upstream update cannot change the server unexpectedly.
    image: diegosouzapw/omniroute:${OMNIROUTE_VERSION:-latest}
    profiles: ["web"]
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      omniroute-redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://omniroute-redis:6379
      OMNIROUTE_WS_BRIDGE_SECRET: ${OMNIROUTE_WS_BRIDGE_SECRET:-}
      # Dashboard password from the first start. The image requires a client API key on /v1 (REQUIRE_API_KEY=true):
      # create it in the dashboard (API Manager) and put it in OMNIROUTE_API_KEY.
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:-}
      PORT: "20128"
    volumes:
      - omniroute-data:/app/data
    ports:
      - "127.0.0.1:20128:20128"

  # Web version and installable phone app (PWA): the AI Stoica service with the web interface (apps/cloud image).
  # Accounts, approval and permissions come from the api service above (same accounts as the Windows app in cloud mode).
  # Turned on by the "web" profile, e.g. COMPOSE_PROFILES=edge,web in .env; served by Caddy at AI_STOICA_WEB_DOMAIN.
  web:
    profiles: ["web"]
    build:
      context: ../..
      dockerfile: apps/cloud/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      omniroute:
        condition: service_started
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      AI_STOICA_CLOUD_API_URL: http://api:8787
      AI_STOICA_OWNER_EMAIL: ${OWNER_EMAIL}
      AI_STOICA_TRUST_PROXY: ${TRUST_PROXY_HOPS:-1}
      AI_STOICA_DEFAULT_MODEL: ${AI_STOICA_DEFAULT_MODEL:-}
      AI_STOICA_CHAT_FALLBACK: ${AI_STOICA_CHAT_FALLBACK:-false}
      AI_STOICA_IMAGE_MODEL: ${AI_STOICA_IMAGE_MODEL:-}
      AI_STOICA_VIDEO_MODEL: ${AI_STOICA_VIDEO_MODEL:-}
      # "Actualizează site-ul" (Owner): the site drops a request here; the server's systemd service runs update.sh.
      AI_STOICA_UPDATE_DIR: /update
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-http://omniroute:20128/v1}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      AI_STOICA_GITHUB_TOKEN: ${AI_STOICA_GITHUB_TOKEN:-}
      AI_STOICA_GITHUB_REPO: ${AI_STOICA_GITHUB_REPO:-}
      AI_STOICA_GITHUB_BRANCH: ${AI_STOICA_GITHUB_BRANCH:-main}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
    volumes:
      - web-data:/data
      - ${AI_STOICA_UPDATE_HOST_DIR:-/var/lib/ai-stoica-update}:/update
    ports:
      - "127.0.0.1:8788:8787"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AI_STOICA_DOMAIN: ${AI_STOICA_DOMAIN}
      AI_STOICA_WEB_DOMAIN: ${AI_STOICA_WEB_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m

volumes:
  postgres-data:
  web-data:
  omniroute-data:
  omniroute-redis-data:
  caddy-data:
  caddy-config:
