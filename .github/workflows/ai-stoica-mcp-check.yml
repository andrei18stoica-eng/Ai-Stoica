name: AI Stoica MCP Check
on:
  pull_request:
    paths:
      - "integrations/claude-mcp/**"
      - "deploy/hetzner/claude-mcp.override.yml"
      - "deploy/hetzner/Caddyfile"
      - ".github/workflows/ai-stoica-mcp-check.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check integrations/claude-mcp/server.mjs
      - run: node --test integrations/claude-mcp/test.mjs
