services:
  ai-stoica-mcp:
    build:
      context: ../..
      dockerfile: integrations/claude-mcp/Dockerfile
    restart: unless-stopped
    # Credentials belong only to the isolated MCP service, not to AI Stoica Web.
    env_file:
      - /etc/ai-stoica/mcp.env
    environment:
      PORT: "3010"
      HOST: "0.0.0.0"
      OMNIROUTE_BASE_URL: "http://omniroute:20128/v1"
      MCP_MAX_OUTPUT_TOKENS: "1024"
      MCP_REQUESTS_PER_MINUTE: "12"
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
