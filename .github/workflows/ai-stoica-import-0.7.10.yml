name: Import AI Stoica 0.7.10

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai-stoica-import-0.7.10.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and apply AI Stoica 0.7.10
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request, zipfile, hashlib

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          shas = [
              "8450aa831e640eceb2345681e5e1fd84a49eff7d",
              "b00e66e86c9ca5fcac63b8906e42cdadb0e48e9e",
              "28ab41168bf27fdd57e202687e70eeb1c3f0987b",
              "62244cd5c45120b9dd342ad9c52ac6270e5e9626",
              "b859ef7dc7aa16e8612f71a96e8759382927079e",
              "d55e314342c860eb65f23f6ffa00d04c22dcbb18",
              "083b34035560076b5b45649c85ddcbbea0adab7e",
              "4a1c95462656109517db0541b2aa9582f013ceda",
              "8adb41a887521ed04f5b8c7d5d58ff05465bde60",
              "60f0d8f4d3f0811e64779fa61b3760d114e70148",
              "61376b44eba761b45d6d9ebbe086307d11044b0e",
              "b86a9dcb4549e743a56d26d0cbbc7c391d90d245",
              "34f6f3e2322f5edb3ffe743536a4c545bc04d67f",
              "f067a26c87a8277b130eb237668408f9d6c9fc59",
              "c2e994675c50e1439f456e42fc148e2a67d166ca",
          ]
          out_path = "/tmp/AI_Stoica_0.7.10_complet.zip"
          with open(out_path, "wb") as out:
              for sha in shas:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "ai-stoica-import",
                      },
                  )
                  with urllib.request.urlopen(req) as response:
                      payload = json.load(response)
                  out.write(base64.b64decode(payload["content"].replace("\n", "")))

          digest = hashlib.sha256(open(out_path, "rb").read()).hexdigest()
          expected = "9b1e2580255600c2fb1fd142bb36dc057bb984f4e27752ba3a90a1f088d2f5e3"
          if digest != expected:
              raise SystemExit(f"SHA256 mismatch: {digest}")

          with zipfile.ZipFile(out_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Bad ZIP member: {bad}")
              for member in archive.infolist():
                  if member.filename.startswith(".github/workflows/"):
                      continue
                  archive.extract(member, ".")
          PY

      - name: Commit AI Stoica 0.7.10 to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release AI Stoica 0.7.10 application"
          git push origin HEAD:main
