name: Validate desktop audit fixes
# retry after JSX fix
on:
  push:
    branches:
      - "fix/audit-desktop-core-0710"
    paths:
      - ".github/workflows/validate-desktop-audit.yml"
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-desktop-core-0710
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh package lock
        working-directory: apps/desktop
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        working-directory: apps/desktop
        run: |
          node --check local-gateway.cjs
          node --check lib/store.cjs
          node --check lib/memory.cjs
          node --check lib/documents.cjs
          node --check lib/extract.cjs
      - name: Audit regression checks
        working-directory: apps/desktop
        run: node scripts/test-audit-fixes.cjs
      - name: Existing module tests
        working-directory: apps/desktop
        run: node scripts/test-modules.cjs
      - name: Existing infrastructure tests
        working-directory: apps/desktop
        run: node scripts/test-infrastructure-regressions.cjs
      - name: Existing permissions tests
        working-directory: apps/desktop
        run: node scripts/test-ai-access-enforcement.cjs
      - name: Build renderer
        working-directory: apps/desktop
        run: npm run build:ui
      - name: Commit refreshed lock and remove temporary workflow
        run: |
          rm .github/workflows/validate-desktop-audit.yml
          git add apps/desktop/package-lock.json .github/workflows/validate-desktop-audit.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh desktop lock for audit fixes"
            git push origin HEAD:fix/audit-desktop-core-0710
          fi
